name: Release Desktop App

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.name }}
    env:
      TARGET_TRIPLE: ${{ matrix.target }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${TARGET_TRIPLE}"
          rustc --version
          cargo --version

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup uv for offline translator
        if: startsWith(matrix.target, 'aarch64-apple-darwin') || startsWith(matrix.target, 'x86_64-apple-darwin')
        uses: astral-sh/setup-uv@v6

      - name: Prepare offline translator virtualenv
        if: startsWith(matrix.target, 'aarch64-apple-darwin') || startsWith(matrix.target, 'x86_64-apple-darwin')
        shell: bash
        run: uv sync --project scripts/offline_translator --frozen

      - name: Verify bundled sidecars
        shell: bash
        run: ./scripts/verify-sidecars.sh

      - name: Install NSIS on Windows
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: choco install nsis --yes

      - name: Detect macOS signing availability
        if: startsWith(matrix.target, 'aarch64-apple-darwin') || startsWith(matrix.target, 'x86_64-apple-darwin')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          ENABLE_MACOS_SIGNING=true
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID KEYCHAIN_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              ENABLE_MACOS_SIGNING=false
            fi
          done
          echo "ENABLE_MACOS_SIGNING=$ENABLE_MACOS_SIGNING" >> "$GITHUB_ENV"

      - name: Import Apple Developer certificate
        if: (startsWith(matrix.target, 'aarch64-apple-darwin') || startsWith(matrix.target, 'x86_64-apple-darwin')) && env.ENABLE_MACOS_SIGNING == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Resolve Apple signing identity
        if: (startsWith(matrix.target, 'aarch64-apple-darwin') || startsWith(matrix.target, 'x86_64-apple-darwin')) && env.ENABLE_MACOS_SIGNING == 'true'
        shell: bash
        run: |
          CERT_ID=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -n 1 | awk -F'"' '{print $2}')
          if [[ -z "$CERT_ID" ]]; then
            echo "Cannot find Developer ID Application certificate in keychain." >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"

      - name: Detect Windows signing availability
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          ENABLE_WINDOWS_SIGNING=true
          for name in WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              ENABLE_WINDOWS_SIGNING=false
            fi
          done
          echo "ENABLE_WINDOWS_SIGNING=$ENABLE_WINDOWS_SIGNING" >> "$GITHUB_ENV"

      - name: Import Windows code signing certificate
        if: matrix.target == 'x86_64-pc-windows-msvc' && env.ENABLE_WINDOWS_SIGNING == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Path certificate -Force | Out-Null
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          Remove-Item certificate/tempCert.txt
          Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText) | Out-Null

      - name: Build Tauri app
        if: env.ENABLE_MACOS_SIGNING == 'true' || !startsWith(matrix.target, 'aarch64-apple-darwin') && !startsWith(matrix.target, 'x86_64-apple-darwin')
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Build Tauri app without signing
        if: env.ENABLE_MACOS_SIGNING != 'true' && (startsWith(matrix.target, 'aarch64-apple-darwin') || startsWith(matrix.target, 'x86_64-apple-darwin'))
        shell: bash
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: bundle-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          path: release-artifacts
          pattern: bundle-*
          merge-multiple: true

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          自动构建产物如下：
          - macOS Apple Silicon
          - macOS Intel
          - Windows x64

          当前工作流会直接使用仓库内置 sidecar。
          如果已配置证书 secrets，会自动启用 macOS / Windows 代码签名。
          请在 Assets 中下载对应平台安装包。
          EOF

          mapfile -t files < <(
            find release-artifacts -type f \
              \( -name '*.dmg' \
              -o -name '*.app.tar.gz' \
              -o -name '*.app.tar.gz.sig' \
              -o -name '*.nsis.zip' \
              -o -name '*.msi.zip' \
              -o -name '*.exe' \
              -o -name '*.msi' \
              -o -name '*.sig' \
              \) \
              -print | sort
          )

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No release assets found under release-artifacts." >&2
            exit 1
          fi

          if gh release view "$TAG_NAME" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release view "$TAG_NAME" --repo "$GH_REPO" --json assets --jq '.assets[].name' > existing-assets.txt
            if [[ -s existing-assets.txt ]]; then
              while IFS= read -r asset_name; do
                gh release delete-asset "$TAG_NAME" "$asset_name" --repo "$GH_REPO" --yes
              done < existing-assets.txt
            fi
            gh release edit "$TAG_NAME" --repo "$GH_REPO" --draft=false --latest --title "muyu $TAG_NAME" --notes-file release-notes.md
            gh release upload "$TAG_NAME" --repo "$GH_REPO" "${files[@]}" --clobber
          else
            gh release create "$TAG_NAME" --repo "$GH_REPO" "${files[@]}" \
              --latest \
              --title "muyu $TAG_NAME" \
              --notes-file release-notes.md
          fi
